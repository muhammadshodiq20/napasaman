name: NapasAman CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-and-wabot-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: napasaman_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip, curl

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare .env and run migrations + seeders
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: napasaman_db
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run NapasAman Feature Tests
        run: php artisan test --filter=NapasAmanTest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: napasaman_db
          DB_USERNAME: root
          DB_PASSWORD: root
          GEMINI_API_KEY: ''

      - name: Setup Node.js and verify wa-bot syntax
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check wa-bot syntax
        run: node --check wa-bot/index.js
